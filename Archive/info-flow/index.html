<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lean WIP & CapEx Planner v3.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <h1 class="mb-4"><i class="bi bi-graph-up"></i> Lean WIP & CapEx Master Plan v3.0 (精益在制品与资本支出规划)</h1>

        <!-- 设置参数 -->
        <div class="card">
            <div class="card-header"><i class="bi bi-gear"></i> Settings / 设置参数</div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Month N+1 Demand / N+1月需求</label>
                        <input type="number" class="form-control" id="demand1" value="2000" min="1">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Month N+2 Demand / N+2月需求</label>
                        <input type="number" class="form-control" id="demand2" value="2200" min="1">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Month N+3 Demand / N+3月需求</label>
                        <input type="number" class="form-control" id="demand3" value="2500" min="1">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Month N+1 Max Days / N+1月最大可排天数</label>
                        <input type="number" class="form-control" id="days1" value="22" min="1">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Month N+2 Max Days / N+2月最大可排天数</label>
                        <input type="number" class="form-control" id="days2" value="21" min="1">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Month N+3 Max Days / N+3月最大可排天数</label>
                        <input type="number" class="form-control" id="days3" value="23" min="1">
                    </div>
                </div>
                <div class="row mt-2">
                    <div class="col-md-12 mb-3">
                        <label class="form-label">Shifts per Day / 每日班次</label>
                        <input type="number" class="form-control" id="shifts" value="2" min="1" max="3" onchange="validateShiftsAndHours()" oninput="validateShiftsAndHours()">
                    </div>
                    <div class="col-md-12 mb-3">
                        <label class="form-label">Hours per Shift / 每班工时</label>
                        <input type="number" class="form-control" id="hoursPerShift" value="12" min="1" max="12" step="0.5" onchange="validateShiftsAndHours()" oninput="validateShiftsAndHours()">
                    </div>
                    <div class="col-md-12 mb-3">
                        <label class="form-label">Target Util. / 目标利用率</label>
                        <input type="number" class="form-control" id="targetUtil" value="0.85" min="0" max="1" step="0.01">
                    </div>
                </div>
                <div class="alert alert-info mb-0">
                    <i class="bi bi-info-circle"></i> 
                    <strong>提示：</strong> 运输步骤将在每两个相邻工序之间独立配置。添加工序后，系统将自动在相邻工序间插入可编辑的运输配置行。
                </div>
            </div>
        </div>

        <!-- 工序列表 -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="bi bi-list-ul"></i> Process List / 工序列表</span>
                <button class="btn btn-light btn-sm" onclick="addProcessRow()"><i class="bi bi-plus-circle"></i> Add Process / 添加</button>
            </div>
            <div class="card-body" id="processContainer"></div>
        </div>

        <!-- 按钮 -->
        <div class="text-center mb-4">
            <button class="btn btn-primary btn-lg" onclick="calculate()"><i class="bi bi-calculator"></i> Calculate / 执行计算</button>
            <button class="btn btn-secondary btn-lg ms-2" onclick="resetForm()"><i class="bi bi-arrow-clockwise"></i> Reset / 重置</button>
        </div>

        <!-- 结果展示 -->
        <div id="resultsSection" style="display:none;">
            <div id="summaryCards"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
