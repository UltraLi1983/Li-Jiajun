<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>价值流岗位工作台</title>
  <style>
    :root{--ink:#183042;--muted:#587083;--line:#d7e1e8;--bg:#f4f7f8;--paper:#fff;--blue:#226b9c;--blue-pale:#eaf4fa;--green:#187d65;--green-pale:#e9f6f0;--amber:#9b6a13;--amber-pale:#fff6e4;--red:#a5493e;--focus:#1e8f7a}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
    button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
    button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:9px 12px;min-height:40px}button:hover{border-color:#89a8ba;background:#f6fbfc}.primary{background:var(--ink);border-color:var(--ink);color:#fff}.primary:hover{background:#27526a;color:#fff}.danger{color:var(--red)}
    .topbar{background:#fff;border-bottom:1px solid var(--line);padding:18px 26px 16px;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}.eyebrow{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.13em}.topbar h1{margin:2px 0 2px;font-size:24px;line-height:1.2}.topbar p{margin:0;color:var(--muted);font-size:13px}.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.save-status{font-size:12px;color:var(--green);min-width:85px;text-align:right}
    .summary{display:flex;gap:10px;padding:15px 26px;flex-wrap:wrap}.summary-card{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 14px;display:flex;gap:8px;align-items:baseline}.summary-card strong{font-size:22px}.summary-card span{font-size:13px;color:var(--muted)}.summary-card.flow strong{color:var(--blue)}.summary-card.support strong{color:var(--green)}.summary-card.pending strong{color:var(--amber)}
    .workspace{display:grid;grid-template-columns:260px minmax(0,1fr) 340px;gap:14px;padding:0 14px 16px;min-height:calc(100vh - 174px)}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;min-width:0;overflow:hidden}.sidebar,.inspector{padding:16px;overflow:auto;max-height:calc(100vh - 178px);position:sticky;top:12px}.panel h2{font-size:16px;margin:0 0 10px}.panel-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.muted{color:var(--muted)}.tiny{font-size:12px;color:var(--muted)}.search{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;margin:5px 0 12px}.section-label{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 7px}.section-label:first-of-type{margin-top:3px}.role-list{display:grid;gap:5px}.role-item{border:1px solid transparent;background:#fff;text-align:left;padding:8px 9px;min-height:40px;width:100%;display:flex;justify-content:space-between;gap:8px;align-items:center}.role-item:hover,.role-item.active{background:#eef7f6;border-color:#b4d6cd}.role-item span:first-child{font-size:13px}.badge{font-size:10px;font-weight:700;white-space:nowrap;padding:2px 6px;border-radius:4px}.badge.flow{background:var(--blue-pale);color:#195e8d}.badge.support{background:var(--green-pale);color:#176c57}.badge.pending{background:var(--amber-pale);color:#865b0c}
    .canvas{overflow:auto;padding:18px 20px 28px;min-height:600px}.canvas-intro{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-bottom:14px}.canvas-intro h2{margin:0;font-size:18px}.canvas-intro p{margin:2px 0 0;color:var(--muted);font-size:13px}.canvas-actions{display:flex;gap:7px;flex-wrap:wrap}.canvas-actions button{font-size:12px;min-height:34px;padding:6px 9px}
    .lane{border:1px solid var(--line);border-radius:12px;background:#fff;padding:16px;margin:0 0 16px;overflow-x:auto}.lane.info{border-top:4px solid var(--blue)}.lane.physical{border-top:4px solid var(--green)}.lane.support-lane{border-top:4px solid #687d8f;background:#f7f9fa}.lane-header{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}.lane-header h3{margin:0;font-size:16px}.lane-header span{font-size:12px;color:var(--muted)}.flow-row{display:flex;gap:24px;width:max-content;padding:3px 4px 8px}.physical .flow-row{flex-direction:row-reverse;margin-left:auto}
    .node-card{position:relative;width:196px;min-height:206px;border:1.5px solid #b5c9d7;background:#fafdff;border-radius:10px;padding:12px;text-align:left;vertical-align:top;display:flex;flex-direction:column;align-items:stretch;gap:7px}.physical .node-card{background:#fbfefd;border-color:#a9cfbf}.node-card.external{background:#f6f7f8;border-color:#c3ccd1}.node-card:hover,.node-card.selected{box-shadow:0 0 0 3px #acd6cb;border-color:var(--focus)}.node-card.highlight{box-shadow:0 0 0 3px #f6cf7a}.node-card .node-kicker{font-size:10px;letter-spacing:.08em;color:var(--muted);font-weight:700}.node-card strong{font-size:16px;line-height:1.3;min-height:41px}.node-card .task-preview{font-size:12px;color:var(--muted);line-height:1.4;min-height:42px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}.chip{font-size:11px;line-height:1.3;color:#1b5964;background:#e7f1f3;padding:3px 5px;border-radius:4px}.physical .chip{background:#e5f3eb;color:#235d49}.chip.empty{color:#786235;background:#fff4d6}.info .node-card:not(:last-child):after{content:'→';position:absolute;right:-22px;top:79px;font-size:22px;font-weight:800;color:var(--blue)}.physical .node-card:not(:last-child):after{content:'←';position:absolute;left:-22px;top:79px;font-size:22px;font-weight:800;color:var(--green)}
    .cross-note{font-size:12px;color:var(--muted);margin:2px 2px 14px;padding:9px 12px;border-left:3px solid #9cb2c0;background:#f1f5f7;max-width:100%}.support-grid{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:10px;min-width:930px}.support-card{border:1px solid var(--line);background:#fff;border-radius:9px;padding:12px;min-height:130px}.support-card h4{margin:0 0 7px;font-size:14px}.support-card p{margin:0 0 9px;font-size:12px;color:var(--muted)}.support-card .chip{display:inline-block;margin:2px;cursor:pointer}.support-card .chip:hover{text-decoration:underline}.support-card button{font-size:11px;min-height:28px;padding:4px 7px;margin-top:7px}.unplaced{border:1px dashed #c8af76;background:#fffbf2;border-radius:10px;padding:12px;margin-top:15px}.unplaced h3{font-size:14px;margin:0 0 6px}.unplaced p{font-size:12px;color:#796c50;margin:0 0 8px}.unplaced .chip{display:inline-block;margin:2px;background:#fff1ce;color:#77520f;cursor:pointer}
    .jd-panel{border:1px solid #b9cbd7;border-radius:12px;background:#fff;padding:16px;margin:0 0 16px;scroll-margin-top:12px;max-height:620px;overflow:auto}.jd-panel h3{font-size:17px;margin:0 0 4px}.jd-panel .jd-intro{font-size:12px;color:var(--muted);margin:0 0 12px}.jd-group{border:1px solid var(--line);border-radius:9px;margin:8px 0;background:#fbfcfd}.jd-group>summary{cursor:pointer;padding:10px 12px;font-weight:700;font-size:13px}.jd-group>summary:hover{background:#eef5f7}.jd-list{list-style:none;margin:0;padding:0 12px 12px;display:grid;gap:8px}.jd-item{border-top:1px solid #e3eaee;padding:9px 2px 2px}.jd-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--muted)}.jd-item p{font-size:13px;margin:6px 0 8px;line-height:1.65;white-space:pre-wrap}.jd-item details{font-size:12px;color:var(--muted)}.jd-item details summary{cursor:pointer;width:fit-content;color:var(--blue)}.jd-controls{display:grid;grid-template-columns:minmax(180px,1fr) minmax(230px,1.4fr);gap:10px;padding:8px 0}.jd-controls label{font-size:11px;font-weight:700;color:#486074}.jd-controls select,.jd-controls textarea{display:block;width:100%;margin-top:4px;border:1px solid #c7d4dc;border-radius:7px;padding:7px;background:#fff;color:var(--ink);font-size:12px}.jd-controls textarea{min-height:64px;resize:vertical}.jd-empty{font-size:13px;color:var(--muted);padding:10px;background:#f7fafb;border-radius:7px}
    .inspector h2{font-size:17px}.inspector .intro{font-size:13px;color:var(--muted);line-height:1.7}.field{display:block;font-size:12px;font-weight:700;color:#3c5364;margin:14px 0}.field input,.field textarea,.field select{display:block;width:100%;margin-top:5px;border:1px solid #bdcdd6;border-radius:8px;padding:9px;background:#fff;color:var(--ink)}.field textarea{min-height:112px;resize:vertical}.field small{display:block;color:var(--muted);font-weight:400;margin-top:4px}.check-list{display:grid;gap:5px;max-height:220px;overflow:auto;border:1px solid var(--line);padding:8px;border-radius:8px}.check-list label{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer;padding:4px}.check-list input{margin-top:3px}.inspector-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.inspector-actions button{font-size:12px}.notice{font-size:12px;color:#735516;background:var(--amber-pale);border:1px solid #edd59c;border-radius:7px;padding:9px;margin:12px 0}.empty-state{padding:25px 8px;color:var(--muted);font-size:13px}.hidden{display:none!important}
    @media(max-width:1250px){.workspace{grid-template-columns:220px minmax(0,1fr)}.inspector{grid-column:1/-1;position:static;max-height:none}.sidebar{max-height:calc(100vh - 178px)}}
    @media(max-width:760px){.topbar{padding:15px}.summary{padding:12px 15px}.workspace{display:flex;flex-direction:column;padding:0 8px 12px}.canvas{order:0;margin-bottom:10px;padding:14px}.sidebar{order:1;position:static;max-height:340px;overflow:auto;margin-bottom:10px}.inspector{order:2;position:static;max-height:none;margin-bottom:10px}.support-grid{grid-template-columns:repeat(4,220px)}.top-actions{width:100%}.save-status{text-align:left}.jd-controls{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="topbar"><div><div class="eyebrow">业务流工作台 · 讨论版本</div><h1>价值流岗位配置</h1><p>从价值流节点定义职能工作；支持岗位围绕整条流提供方法、技术与效率改善。</p></div><div class="top-actions"><span id="saveStatus" class="save-status" role="status" aria-live="polite">准备中</span><button id="exportJson">导出备份</button><button id="importJson">导入备份</button><input id="importFile" type="file" accept="application/json,.json" class="hidden"><button id="exportHtml" class="primary">下载当前工作台 HTML</button></div></header>
  <div class="summary" id="summary"></div>
  <main class="workspace"><aside class="panel sidebar"><div class="panel-head"><h2>岗位清单</h2><button id="addRole" title="新增岗位">＋</button></div><input id="search" class="search" type="search" placeholder="搜索岗位、职能或说明" aria-label="搜索岗位"><div id="roleList"></div><p class="tiny">“未配置”包含 JD 待补齐或跨层待拆分岗位。点击岗位可查看和修改落位。</p></aside>
    <section class="panel canvas"><div class="canvas-intro"><div><h2>价值流画布</h2><p>点击节点编辑职能动作与岗位。上下两条横向线路沿用原图方向。</p></div><div class="canvas-actions"><button data-add-node="info">＋ 信息节点</button><button data-add-node="physical">＋ 实物节点</button></div></div><div id="diagram"></div></section>
    <aside class="panel inspector" id="inspector" aria-live="polite"></aside></main>
  <script type="application/json" id="seed">
  {"version":1,"nodes":[
    {"id":"demand","lane":"info","title":"客户需求（订单／预测）","external":true,"tasks":["销售／客户接口提供订单和预测","计划团队确认有效需求"]},
    {"id":"sop","lane":"info","title":"S&OP","tasks":["平衡需求、产能、供应与库存","确认滚动计划和管理决策"]},
    {"id":"prodplan","lane":"info","title":"生产计划","tasks":["使用已批准工时与产能数据","确定成品库存目标和排程","下达工单并跟踪达成"]},
    {"id":"matplan","lane":"info","title":"物料计划制作与发布","tasks":["按已发布 BOM 计算物料净需求","确定物料库存水位与补货批量","按 HU 整数倍及 MOQ 发布补货计划"]},
    {"id":"suppliercommit","lane":"info","title":"订单与供应承诺","tasks":["依据已批准供应商与商业条件下单","确认交期并回传供应承诺"]},
    {"id":"supplier","lane":"physical","title":"供应商","external":true,"tasks":["按承诺交付物料"]},
    {"id":"receive","lane":"physical","title":"原材料收货","tasks":["仓库核对实物、数量与单据","IQC 判定质量状态","回传到货与可用状态"]},
    {"id":"rawstore","lane":"physical","title":"原材料仓储","tasks":["按库位和批次保管实物","完成盘点、账实核对及状态回传"]},
    {"id":"linefeed","lane":"physical","title":"发料上线","tasks":["按工单与动态指令备料","完成搬运、线边交接与回执"]},
    {"id":"production","lane":"physical","title":"生产","external":true,"tasks":["生产部门领料、报工与产出成品"]},
    {"id":"fgstore","lane":"physical","title":"成品仓储","tasks":["接收与保管成品","核对数量和可发货状态"]},
    {"id":"shipping","lane":"physical","title":"成品发货","tasks":["按交付指令包装、复核和装车","运输、签收并回传回单"]},
    {"id":"customer","lane":"physical","title":"客户","external":true,"tasks":["接收交付"]}
  ],"supportGroups":[
    {"id":"logistics","title":"物流规划","description":"场地、运力、包装、HU、动态实物流指令及效果评价"},
    {"id":"ie","title":"工业工程","description":"标准工时、产能、产线布局与现场效率改善"},
    {"id":"digital","title":"信息化与系统集成","description":"跨系统架构、接口、指令下达与状态回传"},
    {"id":"sourcing","title":"前期“采”与采购治理","description":"寻源、准入、价格、合同条件与项目导入"}
  ],"roles":[
    {"id":"logistics_mgr","name":"计划物流经理","bucket":"flow","nodes":["sop"],"note":"供需平衡与整体运营结果"},
    {"id":"prod_supervisor","name":"生产计划主管","bucket":"flow","nodes":["sop","prodplan"],"note":"生产排程、成品库存水位与交付节奏"},
    {"id":"planner","name":"计划员","bucket":"flow","nodes":["prodplan","matplan","shipping"],"note":"现 JD 同时含生产计划、物料计划和国内发运；目标职责待拆分"},
    {"id":"buyer","name":"采购员（生产物料职责）","bucket":"flow","nodes":["matplan","suppliercommit"],"note":"目标与物料计划合并；非生产采购另议"},
    {"id":"warehouse_mgr","name":"仓库主管","bucket":"flow","nodes":["rawstore","fgstore"],"note":"对仓储实物、账实及现场运营负责"},
    {"id":"valuable_mgr","name":"贵重物品主管","bucket":"flow","nodes":["rawstore"],"note":"负责刀具、夹具、备件专库"},
    {"id":"warehouse_lead","name":"仓库组长","bucket":"flow","nodes":["receive","rawstore","linefeed","fgstore","shipping"],"note":"班组作业调度与现场复核"},
    {"id":"warehouse_clerk","name":"仓库统计文员","bucket":"flow","nodes":["receive","rawstore","fgstore"],"note":"单据、台账、盘点和库存数据"},
    {"id":"keeper","name":"仓管员","bucket":"flow","nodes":["receive","rawstore","linefeed","fgstore","shipping"],"note":"实物收发存盘与交接"},
    {"id":"forklift","name":"叉车工","bucket":"flow","nodes":["rawstore","linefeed"],"note":"装卸、搬运与库位转移"},
    {"id":"tool_keeper","name":"刀具管理员","bucket":"flow","nodes":["rawstore","linefeed"],"note":"刀具入库、保管、领用、盘点"},
    {"id":"packer","name":"打包工","bucket":"flow","nodes":["shipping"],"note":"包装、标识与码垛"},
    {"id":"driver","name":"驾驶员","bucket":"flow","nodes":["shipping"],"note":"运输、签收与回单"},
    {"id":"logistics_design","name":"物流规划（拟设）","bucket":"support","group":"logistics","nodes":[],"note":"未来纳入数字化团队；设计和评价实物流系统"},
    {"id":"ie_mgr","name":"工业工程部高级经理","bucket":"support","group":"ie","nodes":[],"note":"批准标准工时和 C/T，主导效率改善"},
    {"id":"ie_assistant","name":"工业工程部助理","bucket":"support","group":"ie","nodes":[],"note":"测时、数据汇总与现场改善跟进"},
    {"id":"it_mgr","name":"信息经理","bucket":"support","group":"digital","nodes":[],"note":"统筹架构、项目、系统与团队"},
    {"id":"netsec","name":"网络及信息安全工程师","bucket":"support","group":"digital","nodes":[],"note":"网络、基础设施和信息安全"},
    {"id":"developer","name":"软件工程师（C#／U9C）","bucket":"support","group":"digital","nodes":[],"note":"开发、报表和跨系统接口"},
    {"id":"erp","name":"ERP 运维工程师","bucket":"support","group":"digital","nodes":[],"note":"U9C 财务与供应链应用运行"},
    {"id":"plm","name":"PLM 运维工程师","bucket":"support","group":"digital","nodes":[],"note":"PLM 配置、版本与集成技术支持；不定义 BOM"},
    {"id":"proc_director","name":"采购总监","bucket":"support","group":"sourcing","nodes":[],"note":"采购战略、供应商体系、价格与风险"},
    {"id":"project_buyer","name":"项目采购","bucket":"support","group":"sourcing","nodes":[],"note":"项目阶段寻源、供应商开发和量产交接"},
    {"id":"proc_supervisor","name":"采购主管","bucket":"pending","nodes":[],"note":"现 JD 跨日常“购”和前期“采”，目标职责待拆分"},
    {"id":"proc_assistant","name":"采购助理","bucket":"pending","nodes":[],"note":"原 JD 标题为采购助理，岗位字段却写采购主管"},
    {"id":"oa","name":"OA 运维工程师","bucket":"pending","nodes":[],"note":"原 JD 缺少实质工作动作；支持型归属待确认"},
    {"id":"desktop","name":"桌面运维工程师","bucket":"pending","nodes":[],"note":"原 JD 岗位字段和工作动作为空；支持型归属待确认"}

Id":"erp","text":"分析、处理U9C与MES、WMS、OA等周边系统在财务/供应链环节的接口异常与数据一致性问题。","source":{"file":"信息部-部门职责及岗位说明书260318.xlsx","sheet":"《ERP运维工程师岗位说明书》","cell":"E12"},"targetType":"support","targetId":"digital","draft":""},{"id":"plm_7","roleId":"plm","text":"负责华天Inforcenter PLM系统的日常运维管理，包括用户账户、权限、角色及组织结构的创建与维护；快速响应用户咨询、操作与报错问题，诊断并解决常见功能、权限及流程问题；熟悉系统各模块配置与应用，排查后台数据异常。","source":{"file":"信息部-部门职责及岗位说明书260318.xlsx","sheet":"《PLM运维工程师岗位说明书》","cell":"E7"},"targetType":"support","targetId":"digital","draft":""},{"id":"plm_8","roleId":"plm","text":"负责在PLM系统中对APQP项目模板进行系统层面的配置与维护，包括：模板的创建、修改、版本管理、发布、归档等IT操作；根据业务部门提供的标准化内容（如阶段定义、交付物清单、评审节点等），在系统中进行技术实现；确保APQP模板的系统可用性、版本一致性及权限合规性；","source":{"file":"信息部-部门职责及岗位说明书260318.xlsx","sheet":"《PLM运维工程师岗位说明书》","cell":"E8"},"targetType":"support","targetId":"digital","draft":""},{"id":"plm_9","roleId":"plm","text":"建立并维护APQP模板的系统版本管理机制，确保各研发项目使用统一的、最新发布的模板版本；根据业务部门的变更申请，在测试环境中完成模板调整，验证后发布至生产环境；发布前需与业务确认变更内容，发布后通知相关项目团队。","source":{"file":"信息部-部门职责及岗位说明书260318.xlsx","sheet":"《PLM运维工程师岗位说明书》","cell":"E9"},"targetType":"support","targetId":"digital","draft":""},{"id":"plm_10","roleId":"plm","text":"负责系统配置管理（如流程、属性、生命周期状态调整），进行测试后发布至生产环境；分析系统性能瓶颈，提出并实施优化建议；根据业务需求独立完成业务调研、蓝图规划、方案设计及系统实现。","source":{"file":"信息部-部门职责及岗位说明书260318.xlsx","sheet":"《PLM运维工程师岗位说明书》","cell":"E10"},"targetType":"support","targetId":"digital","draft":""},{"id":"plm_11","roleId":"plm","text":"对接研发、工艺等业务部门需求，完成BOM管理、物料主数据维护、ECN变更流程支持；保障PLM与ERP/MES等系统间BOM、物料等核心数据的一致性；整理实施过程中的需求与开发文档。","source":{"file":"信息部-部门职责及岗位说明书260318.xlsx","sheet":"《PLM运维工程师岗位说明书》","cell":"E11"},"targetType":"support","targetId":"digital","draft":""},{"id":"plm_12","roleId":"plm","text":"负责PLM与ERP、MES等外部系统的接口运行状态监控与维护，处理接口报错、数据同步失败等问题；通过集成接口实现产品物料信息、BOM、变更等数据发布到ERP系统，保证上下游数据的一致性与准确性。","source":{"file":"信息部-部门职责及岗位说明书260318.xlsx","sheet":"《PLM运维工程师岗位说明书》","cell":"E12"},"targetType":"support","targetId":"digital","draft":""},{"id":"plm_13","roleId":"plm","text":"运用SQL进行后端数据查询与处理，负责系统日常数据备份与恢复；保障主数据一致性；编写和维护运维手册、配置   <script id="app">
  const STORAGE_KEY = "haiwei-vsm-role-workbench-v1";
  const $ = id => document.getElementById(id);
  const clone = value => JSON.parse(JSON.stringify(value));
  const seed = JSON.parse($('seed').textContent);
  const jdSeed = JSON.parse($('jdSeed').textContent);
  function valid(s){return s&&s.version===1&&Array.isArray(s.nodes)&&Array.isArray(s.roles)&&Array.isArray(s.supportGroups)}
  let state=clone(seed), selected=null, search='';
  if(!Array.isArray(state.jdItems))state.jdItems=clone(jdSeed);
  try{const stored=JSON.parse(localStorage.getItem(STORAGE_KEY));if(valid(stored))state=stored}catch{}
  if(!Array.isArray(state.jdItems))state.jdItems=clone(jdSeed);
  function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));$('saveStatus').textContent='已自动保存';$('saveStatus').style.color=''}catch{$('saveStatus').textContent='自动保存不可用，请导出备份';$('saveStatus').style.color='var(--red)'}}
  function findRole(id){return state.roles.find(r=>r.id===id)}
  function findNode(id){return state.nodes.find(n=>n.id===id)}
  function roleStatus(r){return r.bucket==='flow'&&r.nodes?.length?'flow':r.bucket==='support'&&state.supportGroups.some(g=>g.id===r.group)?'support':'pending'}
  function counts(){const result={flow:0,support:0,pending:0};state.roles.forEach(r=>result[roleStatus(r)]++);return result}
  function roleName(r){return r.name.replace(/（生产物料职责）|（拟设）/g,'')}
  function renderSummary(){const c=counts(),unique=new Set(state.jdItems.map(x=>[x.source.file,x.source.sheet,x.source.cell].join('|'))).size,pending=state.jdItems.filter(x=>x.targetType==='pending').length;$('summary').innerHTML=`<div class="summary-card flow"><strong>${c.flow}</strong><span>已落位价值流</span></div><div class="summary-card support"><strong>${c.support}</strong><span>已归入支持层</span></div><div class="summary-card pending"><strong>${c.pending}</strong><span>未配置／待拆分</span></div><div class="summary-card"><strong>${unique}</strong><span>原始 JD 工作条目</span></div><div class="summary-card pending"><strong>${pending}</strong><span>暂未归入当前价值流的条目</span></div>`}
  function roleButton(r){const status=roleStatus(r),n=state.jdItems.filter(x=>x.roleId===r.id&&x.id.indexOf('_fg')<0).length;return `<button type="button" class="role-item ${selected?.type==='role'&&selected.id===r.id?'active':''}" data-role="${esc(r.id)}"><span>${esc(r.name)}<small class="tiny"> · 原文${n}条</small></span><span class="badge ${status}">${status==='flow'?'已落位':status==='support'?'支持层':'待定'}</span></button>`}
  function renderRoleList(){const q=search.trim().toLowerCase();const matched=state.roles.filter(r=>!q||[r.name,r.note,(r.nodes||[]).map(id=>findNode(id)?.title).join(' '),state.supportGroups.find(g=>g.id===r.group)?.title].join(' ').toLowerCase().includes(q));const order=[['flow','已布置到价值流'],['support','已归入支持层'],['pending','尚未配置']];$('roleList').innerHTML=order.map(([bucket,label])=>`<div class="section-label">${label} · ${matched.filter(r=>roleStatus(r)===bucket).length}</div><div class="role-list">${matched.filter(r=>roleStatus(r)===bucket).map(roleButton).join('')||'<div class="tiny">无匹配岗位</div>'}</div>`).join('')}
  function nodeCard(n){const roles=state.roles.filter(r=>roleStatus(r)==='flow'&&(r.nodes||[]).includes(n.id));const active=selected?.type==='node'&&selected.id===n.id;const highlight=selected?.type==='role'&&roles.some(r=>r.id===selected.id),jdCount=state.jdItems.filter(x=>x.targetType==='node'&&x.targetId===n.id).length;return `<button type="button" class="node-card ${n.external?'external':''} ${active?'selected':''} ${highlight?'highlight':''}" data-node="${esc(n.id)}" aria-label="查看并编辑${esc(n.title)}"><span class="node-kicker">${n.external?'外部接口':n.lane==='info'?'信息／计划节点':'实物流节点'} · 原文${jdCount}条</span><strong>${esc(n.title)}</strong><span class="task-preview">${esc((n.tasks||[]).join('；'))}</span><span class="chips">${roles.length?roles.slice(0,4).map(r=>`<span class="chip">${esc(roleName(r))}</span>`).join('')+(roles.length>4?`<span class="chip">＋${roles.length-4}</span>`:''):'<span class="chip empty">本批 JD 无对应岗位</span>'}</span></button>`}
  function lane(id,title,subtitle){const ns=state.nodes.filter(n=>n.lane===id);return `<section class="lane ${id}"><div class="lane-header"><h3>${title}</h3><span>${subtitle}</span></div><div class="flow-row">${ns.map(nodeCard).join('')}</div></section>`}
  function targetLabel(x){if(x.targetType==='node')return findNode(x.targetId)?.title||'已删除节点';if(x.targetType==='support')return state.supportGroups.find(g=>g.id===x.targetId)?.title||'支持层';return '待归类'}
  function targetOptions(x){const value=x.targetType+'|'+(x.targetId||'');return [...state.nodes.map(n=>['node|'+n.id,(n.lane==='info'?'信息流 · ':'实物流 · ')+n.title]),...state.supportGroups.map(g=>['support|'+g.id,'支持层 · '+g.title]),['pending|','暂不归入当前图']].map(([v,t])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(t)}</option>`).join('')}
  function dutyItem(x){const r=findRole(x.roleId);const tag=x.roleId==='proc_assistant'?'原表疑似复制错位':roleStatus(r||{})==='pending'?'岗位待拆分':x.targetType==='support'&&r?.bucket==='flow'?'原岗位职责，拟转支持层':'';return `<li class="jd-item"><div class="jd-meta"><span title="${esc(x.source.file)}">${esc(x.source.sheet)} · ${esc(x.source.cell)}</span><span>当前归入：${esc(targetLabel(x))}</span>${tag?`<span class="badge pending">${esc(tag)}</span>`:''}${x.id.endsWith('_fg')?'<span>同一原文同时适用原料与成品</span>':''}</div><p>${esc(x.text)}</p><details><summary>调整归属／填写讨论修改</summary><div class="jd-controls"><div class="jd-source">源文件：${esc(x.source.file)}</div><label>归入职能<select data-duty-target="${esc(x.id)}">${targetOptions(x)}</select></label><label>讨论修改稿（原文保留）<textarea data-duty-draft="${esc(x.id)}" placeholder="可写修改建议；原文不会被覆盖">${esc(x.draft||'')}</textarea></label></div></details></li>`}
  function dutyPanel(){if(!selected)return '';let items=[],title='原始 JD 工作内容';if(selected.type==='node'){const n=findNode(selected.id);items=state.jdItems.filter(x=>x.targetType==='node'&&x.targetId===selected.id);title=(n?.title||'节点')+' · 原始 JD 工作内容'}else if(selected.type==='group'){const g=state.supportGroups.find(x=>x.id===selected.id);items=state.jdItems.filter(x=>x.targetType==='support'&&x.targetId===selected.id);title=(g?.title||'支持层')+' · 原始 JD 工作内容'}else if(selected.type==='role'){const r=findRole(selected.id);items=state.jdItems.filter(x=>x.roleId===selected.id);title=(r?.name||'岗位')+' · 原始 JD 工作内容'}else if(selected.type==='pending'){items=state.jdItems.filter(x=>x.targetType==='pending');title='尚未归入当前价值流的原文'}const groups=new Map();items.forEach(x=>{const name=findRole(x.roleId)?.name||x.roleId;if(!groups.has(name))groups.set(name,[]);groups.get(name).push(x)});return `<section class="jd-panel" id="jdPanel"><h3>${esc(title)} · ${items.length} 条</h3><p class="jd-intro">按原始表格逐条罗列。原文和单元格位置保留；“讨论修改稿”单独记录。初步归入的职责可逐条改到其他节点或支持层。</p>${items.length?[...groups].map(([name,list])=>`<details class="jd-group" open><summary>${esc(name)} · ${list.length} 条</summary><ol class="jd-list">${list.map(dutyItem).join('')}</ol></details>`).join(''):'<div class="jd-empty">该节点或岗位在所提供 JD 中没有可核验的具体工作动作。</div>'}</section>`}
  function renderDiagram(){const groups=state.supportGroups.map(g=>{const roles=state.roles.filter(r=>roleStatus(r)==='support'&&r.group===g.id),n=state.jdItems.filter(x=>x.targetType==='support'&&x.targetId===g.id).length;return `<div class="support-card"><h4>${esc(g.title)} <span class="tiny">· 原文${n}条</span></h4><p>${esc(g.description)}</p><div>${roles.map(r=>`<span class="chip" tabindex="0" role="button" data-role="${esc(r.id)}">${esc(r.name)}</span>`).join('')||'<span class="tiny">尚无岗位</span>'}</div><button data-group="${esc(g.id)}">查看并编辑工作内容</button></div>`}).join('');const pending=state.roles.filter(r=>roleStatus(r)==='pending'),pendingItems=state.jdItems.filter(x=>x.targetType==='pending').length,p=selected&&selected.type==='node'?findNode(selected.id)?.lane:null,detail=dutyPanel();$('diagram').innerHTML=lane('info','信息流','客户需求 → 供应商承诺')+(p==='info'?detail:'')+`<div class="cross-note">垂直交接：成品发货反馈客户需求；生产实绩反馈生产计划；原材料收货与库存反馈物料采购／计划。后续可在节点中细化指令、回执和评价口径。</div>`+lane('physical','实物流','供应商 → 客户；从右向左阅读')+(p==='physical'?detail:'')+`<section class="lane support-lane"><div class="lane-header"><h3>支持型人员</h3><span>定义规则、技术实现、评价与改善</span></div><div class="support-grid">${groups}</div></section>`+(selected?.type==='group'?detail:'')+`<section class="unplaced"><h3>未配置／待拆分 · ${pending.length} 个岗位</h3><p>另有 ${pendingItems} 条原文尚未归入当前价值流；其中采购助理工作表疑似复制错位，需先校验。</p>${pending.map(r=>`<span class="chip" tabindex="0" role="button" data-role="${esc(r.id)}">${esc(r.name)}</span>`).join('')||'<span class="tiny">当前无未配置岗位</span>'}<div><button data-pending-items>查看未归类原文 · ${pendingItems} 条</button></div></section>`+((selected?.type==='role'||selected?.type==='pending')?detail:'')}
  function checkboxList(type,ids){const list=type==='roles'?state.roles.filter(r=>r.bucket==='flow').map(r=>({id:r.id,label:r.name})):state.nodes.map(n=>({id:n.id,label:n.title}));return `<div class="check-list">${list.map(item=>`<label><input type="checkbox" data-toggle-${type==='roles'?'role':'node'}="${esc(item.id)}" ${ids.includes(item.id)?'checked':''}><span>${esc(item.label)}</span></label>`).join('')}</div>`}
  function renderInspector(){const s=selected;if(!s){$('inspector').innerHTML='<h2>编辑工作内容</h2><p class="intro">选择图中节点，可在画布上按岗位查看原始 JD 条目，在这里编辑该节点的目标职能动作与岗位。点击岗位可查看其原文和落位。原文保留，修改建议单独记录。</p><div class="notice">当前是目标组织讨论稿。原 JD 缺项、跨层岗位和拟设岗位已标出，不代表编制或审批已确定。</div>';return}
    if(s.type==='node'){const n=findNode(s.id);if(!n){selected=null;renderInspector();return}const assigned=state.roles.filter(r=>r.bucket==='flow'&&(r.nodes||[]).includes(n.id)).map(r=>r.id);$('inspector').innerHTML=`<h2>编辑价值流节点</h2><p class="tiny">${n.lane==='info'?'信息流':'实物流'} · ${n.external?'外部接口':'内部业务节点'}</p><label class="field">节点名称<input data-node-field="title" value="${esc(n.title)}"></label><label class="field">职能工作动作<textarea data-node-field="tasks" placeholder="每行一项工作动作">${esc((n.tasks||[]).join('\n'))}</textarea><small>每行一项。先定义业务动作，再调整人员配置。</small></label><div class="field">承担此节点的职能型岗位</div>${checkboxList('roles',assigned)}<div class="inspector-actions"><button data-move-node="-1">← 前移</button><button data-move-node="1">后移 →</button><button data-delete-node class="danger">删除节点</button></div>`;return}
    if(s.type==='role'){const r=findRole(s.id);if(!r){selected=null;renderInspector();return}const status=roleStatus(r);$('inspector').innerHTML=`<h2>编辑岗位</h2><p class="tiny">当前状态：${status==='flow'?'已布置到价值流':status==='support'?'已归入支持层':'未配置／待拆分'}</p><label class="field">岗位名称<input data-role-field="name" value="${esc(r.name)}"></label><label class="field">类型<select data-role-field="bucket"><option value="flow" ${r.bucket==='flow'?'selected':''}>职能型：进入价值流</option><option value="support" ${r.bucket==='support'?'selected':''}>支持型：进入支持层</option><option value="pending" ${r.bucket==='pending'?'selected':''}>暂不配置／待拆分</option></select></label>${r.bucket==='flow'?`<div class="field">落位节点</div>${checkboxList('nodes',r.nodes||[])}`:''}${r.bucket==='support'?`<label class="field">支持能力<select data-role-field="group">${state.supportGroups.map(g=>`<option value="${esc(g.id)}" ${r.group===g.id?'selected':''}>${esc(g.title)}</option>`).join('')}</select></label>`:''}<label class="field">职能边界／待确认事项<textarea data-role-field="note">${esc(r.note||'')}</textarea></label>${r.bucket==='pending'?'<div class="notice">此岗位不会出现在价值流节点或支持层。确认职责后再调整类型与落位。</div>':''}<div class="inspector-actions"><button data-delete-role class="danger">删除岗位</button></div>`;return}
    if(s.type==='group'){const g=state.supportGroups.find(x=>x.id===s.id);if(!g){selected=null;renderInspector();return}$('inspector').innerHTML=`<h2>编辑支持能力</h2><label class="field">能力名称<input data-group-field="title" value="${esc(g.title)}"></label><label class="field">如何支持价值流<textarea data-group-field="description">${esc(g.description)}</textarea></label><p class="tiny">岗位归属请点击左侧岗位修改。</p>`;return}
    if(s.type==='pending'){$('inspector').innerHTML='<h2>未归类原文</h2><p class="intro">这里保留当前图尚未承载的原始 JD 工作内容，包括项目、异常、审核等动作，以及采购助理工作表中疑似错位的文字。逐条确认后可归入节点或支持层。</p>'}
  }
  function render(){renderSummary();renderRoleList();renderDiagram();renderInspector();if(selected){const count=$('jdPanel')?.querySelectorAll('.jd-item').length||0;$('inspector').insertAdjacentHTML('afterbegin',`<a href="#jdPanel" class="tiny">查看本项原始 JD 工作内容 · ${count} 条 ↓</a>`)}}
  function select(type,id){selected={type,id};render();if(window.innerWidth<1250)$('jdPanel')?.scrollIntoView({behavior:'smooth',block:'start'})}
  document.addEventListener('click',e=>{const role=e.target.closest('[data-role]');if(role){select('role',role.dataset.role);return}const node=e.target.closest('[data-node]');if(node){select('node',node.dataset.node);return}const group=e.target.closest('[data-group]');if(group){select('group',group.dataset.group);return}if(e.target.closest('[data-pending-items]')){select('pending','all');return}
    const add=e.target.closest('[data-add-node]');if(add){const lane=add.dataset.addNode;const id='node_'+Date.now();state.nodes.push({id,lane,title:lane==='info'?'新信息节点':'新实物流节点',tasks:[]});selected={type:'node',id};save();render();return}
    if(e.target.id==='addRole'){const id='role_'+Date.now();state.roles.push({id,name:'新岗位',bucket:'pending',nodes:[],note:''});selected={type:'role',id};save();render();return}
    if(e.target.dataset.moveNode){const n=findNode(selected?.id);if(!n)return;const laneNodes=state.nodes.filter(x=>x.lane===n.lane),i=laneNodes.findIndex(x=>x.id===n.id),j=i+Number(e.target.dataset.moveNode);if(j<0||j>=laneNodes.length)return;const other=laneNodes[j],a=state.nodes.indexOf(n),b=state.nodes.indexOf(other);[state.nodes[a],state.nodes[b]]=[state.nodes[b],state.nodes[a]];save();render();return}
    if(e.target.hasAttribute('data-delete-node')){const id=selected?.id;if(!id||!confirm('删除这个价值流节点及其岗位落位？'))return;state.nodes=state.nodes.filter(n=>n.id!==id);state.roles.forEach(r=>r.nodes=(r.nodes||[]).filter(x=>x!==id));selected=null;save();render();return}
    if(e.target.hasAttribute('data-delete-role')){const id=selected?.id;if(!id||!confirm('删除这个岗位条目？'))return;state.roles=state.roles.filter(r=>r.id!==id);selected=null;save();render();return}
  });
  document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-role][role="button"]')){e.preventDefault();select('role',e.target.dataset.role)}});
  $('inspector').addEventListener('change',e=>{if(!selected)return;const n=selected.type==='node'?findNode(selected.id):null,r=selected.type==='role'?findRole(selected.id):null,g=selected.type==='group'?state.supportGroups.find(x=>x.id===selected.id):null;
    if(n&&e.target.dataset.nodeField){const k=e.target.dataset.nodeField;n[k]=k==='tasks'?e.target.value.split('\n').map(s=>s.trim()).filter(Boolean):e.target.value.trim();save();render();return}
    if(r&&e.target.dataset.roleField){const k=e.target.dataset.roleField;r[k]=e.target.value;if(k==='bucket'){if(r.bucket==='support'){r.group=r.group||state.supportGroups[0]?.id;r.nodes=[]}else if(r.bucket==='pending'){r.nodes=[];delete r.group}else delete r.group}save();render();return}
    if(g&&e.target.dataset.groupField){g[e.target.dataset.groupField]=e.target.value.trim();save();render();return}
    if(n&&e.target.dataset.toggleRole){const role=findRole(e.target.dataset.toggleRole);if(role){role.nodes=role.nodes||[];role.nodes=e.target.checked?[...new Set([...role.nodes,n.id])]:role.nodes.filter(id=>id!==n.id);save();render()}return}
    if(r&&e.target.dataset.toggleNode){const id=e.target.dataset.toggleNode;r.nodes=r.nodes||[];r.nodes=e.target.checked?[...new Set([...r.nodes,id])]:r.nodes.filter(x=>x!==id);save();render()}
  });
  $('diagram').addEventListener('change',e=>{const id=e.target.dataset.dutyTarget;if(!id)return;const item=state.jdItems.find(x=>x.id===id);if(!item)return;const [type,targetId]=e.target.value.split('|');item.targetType=type;item.targetId=targetId||'';save();render()});
  $('diagram').addEventListener('input',e=>{const id=e.target.dataset.dutyDraft;if(!id)return;const item=state.jdItems.find(x=>x.id===id);if(item){item.draft=e.target.value;save()}});
  $('search').addEventListener('input',e=>{search=e.target.value;renderRoleList()});
  function download(content,mime,name){const url=URL.createObjectURL(new Blob([content],{type:mime})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
  $('exportJson').onclick=()=>download(JSON.stringify(state,null,2),'application/json','价值流岗位工作台_备份.json');
  $('importJson').onclick=()=>$('importFile').click();
  $('importFile').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const incoming=JSON.parse(await file.text());if(!valid(incoming))throw Error('备份格式或版本不匹配');state=incoming;if(!Array.isArray(state.jdItems))state.jdItems=clone(jdSeed);selected=null;save();render()}catch(error){alert('导入失败：'+error.message)}finally{e.target.value=''}};
  $('exportHtml').onclick=()=>{const doc=document.documentElement.cloneNode(true);doc.querySelector('#seed').textContent=JSON.stringify(state).replace(/</g,'\\u003c');const app=doc.querySelector('#app');app.textContent=app.textContent.replace('const STORAGE_KEY = "haiwei-vsm-role-workbench-v1";','const STORAGE_KEY = "haiwei-vsm-role-snapshot-'+Date.now()+'";');download('<!doctype html>\n'+doc.outerHTML,'text/html;charset=utf-8','价值流岗位工作台_当前版本.html')};
  render();save();
  </script>
</body>
</html>
