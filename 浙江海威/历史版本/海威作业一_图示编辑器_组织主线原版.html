<style>

ont-size:12px;line-height:1.8;color:#627580}.status{padding:9px 18px;background:#fff;border-top:1px solid var(--line);font-size:12px}#toast{position:fixed;bottom:24px;left:24px;max-width:80vw;background:#173d50;color:white;padding:13px 20px;border-radius:6px;display:none;z-index:10}.present aside,.present header,.present .bar,.present .status{display:none}.present main{display:block;height:100vh}.present .workspace{height:100vh}.present #back{display:block;position:fixed;right:16px;top:16px;z-index:9}#back{display:none}.legend{margin-top:20px;padding-top:12px;border-top:1px solid var(--line)}@media(max-width:800px){main{grid-template-columns:1fr;height:auto}aside{border-left:0;border-top:1px solid var(--line)}.viewport{height:65vh;flex:auto}.tools{margin-left:0}}@media print{header,aside,.bar,.status,#back{display:none!important}main{display:block;height:auto}.viewport{padding:0;overflow:visible}svg{width:100%!important;height:auto!important;box-shadow:none}body{background:#fff}}
</style></head><body>
<header><div><h1>海威 · 组织与收益图示</h1><p>作业一 / 可编辑讨论稿 · 拖动排版，点击编辑，导出保留修改</p></div><div class="tools"><button id="undo">撤销</button><button id="redo">重做</button><button id="add">＋节点</button><button id="import">导入 JSON</button><button id="json">导出 JSON</button><button id="svgout">导出 SVG</button><button id="htmlout" class="primary">保存完整 HTML</button></div></header>
<main><section class="workspace"><div class="bar"><button id="fit">适应画面</button><button id="minus">−</button><span id="zoomLabel">100%</span><button id="plus">＋</button><button id="present">演示</button><span>点击节点或连线编辑 · 拖动节点 · 方向键微调 · Ctrl / ⌘ Z 撤销</span></div><div class="viewport" id="viewport"><svg id="board" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="海威组织、团队与收益时间轴"></svg></div><div class="status" id="status">正在载入</div></section>
<aside><h2 id="panelTitle">图示设置</h2><div id="panel"></div><h3>添加连线</h3><label for="from">起点</label><select id="from"></select><label for="to">终点</label><select id="to"></select><label for="edgeStyle">线型</label><select id="edgeStyle"><option value="solid">实线：确定的推进关系</option><option value="dashed">虚线：拟议参与／参考关系</option></select><button id="connect" style="margin-top:12px;width:100%">添加连线</button><div class="legend hint">IE 以虚线表示，组织归属待讨论。<br>收益为预期方向，未经财务确认。<br>本页离线运行，不上传数据。浏览器草稿仅供恢复，请用「保存完整 HTML」保留正式版本。</div><button id="reset" class="danger" style="margin-top:18px">恢复初始图示</button></aside></main><button id="back">退出演示</button><div id="toast" role="status"></div><input id="file" type="file" accept="application/json,.json" hidden>
<script id="seed" type="application/json">{"version": 1, "title": "组织与人才建设，如何转化为经营收益", "subtitle": "作业一 · 讨论稿｜实线表示推进关系；IE 虚线表示拟议参与，组织归属待定。", "nodes": [{"id": "org", "title": "组织责任与能力建设", "body": "新建计划与供应链职能；承接信息化、仓储及物流。\n集团供应链与数字化 VP 为拟议职责定位。", "x": 430, "y": 110, "w": 600, "color": "blue", "dashed": false}, {"id": "plan", "title": "计划人员培养", "body": "理解业务底层逻辑与上下游衔接。\n明确价值目标、软件功能边界与人工决策条件。", "x": 40, "y": 325, "w": 320, "color": "blue", "dashed": false}, {"id": "soft", "title": "软件人员培养", "body": "进入真实运营场景，理解功能如何服务人员。\n识别物理事实的数字转化点，验证过程价值。", "x": 400, "y": 325, "w": 320, "color": "blue", "dashed": false}, {"id": "flow", "title": "实物流／仓储人员培养", "body": "执行理解规划，规划深入现场。\n理解、评价、预判并按权限调整运作。", "x": 760, "y": 325, "w": 320, "color": "blue", "dashed": false}, {"id": "ie", "title": "IE｜组织归属待讨论", "body": "在现有环境与条件下观察、测量一线。\n与计划、实物流人员共同寻找最佳实践。", "x": 1120, "y": 325, "w": 300, "color": "amber", "dashed": true}, {"id": "joint", "title": "共同进入现场，寻找并验证最佳实践", "body": "业务规则＋真实数据＋软件边界＋物理执行。\n明确责任人、异常升级及收益验证方式。", "x": 420, "y": 575, "w": 610, "color": "blue", "dashed": false}, {"id": "base", "title": "首月｜原始状态基线", "body": "测算原运作状态，保存口径与业务条件。\n持续记录改善及实施投入。", "x": 40, "y": 825, "w": 310, "color": "gray", "dashed": false}, {"id": "phase1", "title": "0—3 个月｜建立运作基础", "body": "梳理架构、责任与协作机制。\n开展人员培养、试运行与现场改善。\n前三个月完成架构与运作模式梳理。", "x": 400, "y": 825, "w": 330, "color": "blue", "dashed": false}, {"id": "phase2", "title": "3—6 个月｜预期收益形成", "body": "改进机制持续运行。\n预期形成有效产出、成本与库存改善。\n收益形成不等同于已正式确认。", "x": 770, "y": 825, "w": 330, "color": "green", "dashed": false}, {"id": "phase3", "title": "第 6 个月后｜正式收益核算", "body": "比较原状态与改进状态，校正业务条件变化。\n确认增量贡献与实际节约；现金释放单列。\n扣除实施投入，避免重复计算。", "x": 1140, "y": 825, "w": 340, "color": "green", "dashed": false}, {"id": "future", "title": "验证后推广与升级", "body": "向客户端和供应端延展，支撑海外复制。\n逐步建立物理过程的数字化投影，以可信数据支持更细粒度计算与 AI 优化。", "x": 760, "y": 1120, "w": 720, "color": "blue", "dashed": false}], "edges": [{"id": "e0", "to": "plan", "style": "solid", "from": "org"}, {"id": "e1", "to": "joint", "style": "solid", "from": "plan"}, {"id": "e2", "to": "soft", "style": "solid", "from": "org"}, {"id": "e3", "to": "joint", "style": "solid", "from": "soft"}, {"id": "e4", "to": "flow", "style": "solid", "from": "org"}, {"id": "e5", "to": "joint", "style": "solid", "from": "flow"}, {"id": "e6", "to": "joint", "style": "dashed", "from": "ie"}, {"id": "e7", "to": "phase1", "style": "solid", "from": "joint"}, {"id": "e8", "to": "phase2", "style": "solid", "from": "phase1"}, {"id": "e9", "to": "phase3", "style": "solid", "from": "phase2"}, {"id": "e10", "to": "phase1", "style": "dashed", "from": "base"}, {"id": "e11", "to": "future", "style": "solid", "from": "phase3"}]}</script>
<script>
'use strict';
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
const initial=JSON.parse($('seed').textContent);let state=structuredClone(initial),sel=null,zoom=.65,history=[],future=[],drag=null;
const colors={blue:['#edf5fa','#22658b'],green:['#edf7f2','#28765f'],amber:['#fff7e9','#a76e18'],gray:['#f2f4f6','#637786']};
const key='haiwei-map:'+location.pathname;let cached=null;try{cached=localStorage.getItem(key)}catch(e){}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').style.display='none',3200)}
function save(){try{localStorage.setItem(key,JSON.stringify(state));$('status').textContent='已保存浏览器草稿 · '+new Date().toLocaleTimeString()+' · 请导出 HTML 保留正式版本'}catch(e){$('status').textContent='浏览器草稿不可用，请导出 HTML 保存'}}
function checkpoint(){history.push(JSON.stringify(state));if(history.length>80)history.shift();future=[]}
function mutate(fn){checkpoint();fn();render();panel();save()}
function el(tag,attrs={},text){let e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e}
function wrap(text,width,size){let lines=[];for(const para of text.split('\n')){let line='',used=0;for(const c of para){let cw=/[\x00-\xff]/.test(c)?size*.57:size;if(used+cw>width&&line){lines.push(line);line='';used=0}line+=c;used+=cw}lines.push(line)}return lines}
function geometry(n){const a=wrap(n.title,n.w-36,19),b=wrap(n.body,n.w-36,15);return{a,b,h:Math.max(90,30+a.length*27+10+b.length*24+18)}}
function dims(){return{w:Math.max(1450,...state.nodes.map(n=>n.x+n.w+40)),h:Math.max(950,...state.nodes.map(n=>n.y+geometry(n).h+40))}}
function render(){let svg=$('board');svg.replaceChildren();const d=dims();svg.setAttribute('viewBox',`0 0 ${d.w} ${d.h}`);svg.style.width=d.w*zoom+'px';svg.style.height=d.h*zoom+'px';
const defs=el('defs');const m=el('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'});m.append(el('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#7c929f'}));defs.append(m);svg.append(defs);
svg.append(el('text',{x:40,y:43,fill:'#173d50','font-size':26,'font-weight':700},state.title));svg.append(el('text',{x:40,y:72,fill:'#647c89','font-size':14},state.subtitle));
for(const edge of state.edges){let a=state.nodes.find(n=>n.id===edge.from),b=state.nodes.find(n=>n.id===edge.to);if(!a||!b)continue;let ah=geometry(a).h,bh=geometry(b).h;let x1=a.x+a.w/2,y1=a.y+ah,x2=b.x+b.w/2,y2=b.y;if(Math.abs((b.x+b.w/2)-(a.x+a.w/2))>Math.abs(b.y-a.y)){x1=a.x+(b.x>a.x?a.w:0);y1=a.y+ah/2;x2=b.x+(b.x>a.x?0:b.w);y2=b.y+bh/2}else if(b.y<a.y){y1=a.y;y2=b.y+bh}
let path=`M ${x1} ${y1} L ${x2} ${y2}`;let g=el('g',{'class':'edge','data-edge':edge.id});g.append(el('path',{d:path,fill:'none',stroke:'transparent','stroke-width':18}));g.append(el('path',{d:path,fill:'none',stroke:sel?.id===edge.id?'#1665a0':'#8fa2ad','stroke-width':sel?.id===edge.id?3:2,'stroke-dasharray':edge.style==='dashed'?'8 6':'none','marker-end':'url(#arrow)'}));g.addEventListener('click',()=>{sel={type:'edge',id:edge.id};render();panel()});svg.append(g)}
for(const n of state.nodes){const q=geometry(n),c=colors[n.color]||colors.blue;const g=el('g',{'class':'node','data-node':n.id,transform:`translate(${n.x},${n.y})`,tabindex:0,role:'button','aria-label':n.title});g.append(el('rect',{width:n.w,height:q.h,rx:8,fill:c[0],stroke:sel?.id===n.id?'#1275b2':c[1],'stroke-width':sel?.id===n.id?3:1.3,'stroke-dasharray':n.dashed?'7 5':'none'}));g.append(el('rect',{x:0,y:14,width:4,height:30,fill:c[1]}));let y=30;for(const line of q.a){g.append(el('text',{x:18,y,fill:'#153647','font-size':19,'font-weight':650},line));y+=27}y+=8;for(const line of q.b){g.append(el('text',{x:18,y,fill:'#3c5969','font-size':15},line));y+=24}g.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();sel={type:'node',id:n.id};drag={id:n.id,x:e.clientX,y:e.clientY,nx:n.x,ny:n.y,before:JSON.stringify(state),moved:false};panel();render()});g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();sel={type:'node',id:n.id};render();panel();$('title')?.focus()}});svg.append(g)}
$('zoomLabel').textContent=Math.round(zoom*100)+'%';$('undo').disabled=!history.length;$('redo').disabled=!future.length;
const oldFrom=$('from').value,oldTo=$('to').value;for(const id of ['from','to']){$(id).replaceChildren();for(const n of state.nodes){let o=document.createElement('option');o.value=n.id;o.textContent=n.title;$(id).append(o)}}if(state.nodes.some(n=>n.id===oldFrom))$('from').value=oldFrom;if(state.nodes.some(n=>n.id===oldTo))$('to').value=oldTo;else if(state.nodes.length>1)$('to').selectedIndex=1;
}
function field(label,id,value,kind='input'){let l=document.createElement('label');l.htmlFor=id;l.textContent=label;let i=document.createElement(kind);i.id=id;i.value=value;$('panel').append(l,i);return i}
function panel(){const p=$('panel');p.replaceChildren();let n=sel?.type==='node'?state.nodes.find(n=>n.id===sel.id):null,e=sel?.type==='edge'?state.edges.find(e=>e.id===sel.id):null;$('panelTitle').textContent=n?'编辑节点':e?'编辑连线':'图示设置';
if(n){field('标题','title',n.title);field('内容（回车换行）','body',n.body,'textarea');let color=field('类别颜色','color','','select');for(const[k,label]of Object.entries({blue:'业务／组织',green:'收益／结果',amber:'拟议／提醒',gray:'基线／条件'})){let o=document.createElement('option');o.value=k;o.textContent=label;color.append(o)}color.value=n.color;field('卡片宽度（240—700）','width',n.w).type='number';field('水平位置','posx',n.x).type='number';field('垂直位置','posy',n.y).type='number';let dash=field('虚线边框','dashed',n.dashed?'yes':'no','select');for(const[v,t]of [['no','实线'],['yes','虚线']]){let o=document.createElement('option');o.value=v;o.textContent=t;dash.append(o)}dash.value=n.dashed?'yes':'no';button('应用修改',()=>mutate(()=>{n.title=$('title').value;n.body=$('body').value;n.color=$('color').value;n.w=Math.min(700,Math.max(240,Number($('width').value)||320));n.x=Math.max(20,Number($('posx').value)||20);n.y=Math.max(100,Number($('posy').value)||100);n.dashed=$('dashed').value==='yes'}),'primary');button('复制节点',()=>mutate(()=>{let copy={...n,id:uid(),x:n.x+40,y:n.y+40};state.nodes.push(copy);sel={type:'node',id:copy.id}}));button('删除节点及关联线',()=>{if(confirm('删除此节点及其关联连线？'))mutate(()=>{state.nodes=state.nodes.filter(x=>x.id!==n.id);state.edges=state.edges.filter(x=>x.from!==n.id&&x.to!==n.id);sel=null})},'danger')}
else if(e){let hint=document.createElement('p');hint.className='hint';hint.textContent=state.nodes.find(n=>n.id===e.from).title+' → '+state.nodes.find(n=>n.id===e.to).title;p.append(hint);button(e.style==='dashed'?'改为实线':'改为虚线',()=>mutate(()=>e.style=e.style==='dashed'?'solid':'dashed'));button('反转方向',()=>mutate(()=>{[e.from,e.to]=[e.to,e.from]}));button('删除连线',()=>mutate(()=>{state.edges=state.edges.filter(x=>x.id!==e.id);sel=null}),'danger')}
else{field('图示标题','mapTitle',state.title);field('副标题','mapSub',state.subtitle,'textarea');button('应用标题',()=>mutate(()=>{state.title=$('mapTitle').value;state.subtitle=$('mapSub').value}),'primary');let h=document.createElement('p');h.className='hint';h.textContent='点击卡片修改内容和颜色；拖动卡片调整排版。连线可选中切换实线、虚线或删除。';p.append(h)}}
function button(t,fn,c=''){let b=document.createElement('button');b.textContent=t;b.className=c;b.style.margin='12px 6px 0 0';b.onclick=fn;$('panel').append(b)}
const uid=()=> 'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
document.addEventListener('pointermove',e=>{if(!drag)return;let dx=(e.clientX-drag.x)/zoom,dy=(e.clientY-drag.y)/zoom;if(Math.abs(dx)+Math.abs(dy)>2)drag.moved=true;let n=state.nodes.find(n=>n.id===drag.id);n.x=Math.max(20,Math.round(drag.nx+dx));n.y=Math.max(100,Math.round(drag.ny+dy));render()});
function endDrag(){if(!drag)return;if(drag.moved){history.push(drag.before);future=[];save()}drag=null;render();panel()}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);window.addEventListener('blur',endDrag);
$('board').addEventListener('click',e=>{if(e.target===$('board')){sel=null;render();panel()}});
function undo(){if(!history.length)return;future.push(JSON.stringify(state));state=JSON.parse(history.pop());sel=null;render();panel();save()}
function redo(){if(!future.length)return;history.push(JSON.stringify(state));state=JSON.parse(future.pop());sel=null;render();panel();save()}
$('undo').onclick=undo;$('redo').onclick=redo;
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}if(e.key==='Escape'){document.body.classList.remove('present');fit()}if(sel?.type==='node'&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();let n=state.nodes.find(n=>n.id===sel.id),step=e.shiftKey?20:5;mutate(()=>{n.x=Math.max(20,n.x+({ArrowLeft:-step,ArrowRight:step}[e.key]||0));n.y=Math.max(100,n.y+({ArrowUp:-step,ArrowDown:step}[e.key]||0))})}});
function fit(){zoom=Math.max(.2,Math.min(1.3,($('viewport').clientWidth-48)/dims().w));render()}
$('fit').onclick=fit;$('plus').onclick=()=>{zoom=Math.min(1.6,zoom+.1);render()};$('minus').onclick=()=>{zoom=Math.max(.2,zoom-.1);render()};$('present').onclick=()=>{document.body.classList.add('present');fit()};$('back').onclick=()=>{document.body.classList.remove('present');fit()};
$('add').onclick=()=>mutate(()=>{let n={id:uid(),title:'新增节点',body:'填写职责、动作或收益。',x:80,y:Math.max(120,Math.round($('viewport').scrollTop/zoom)+130),w:330,color:'blue'};state.nodes.push(n);sel={type:'node',id:n.id}});
$('connect').onclick=()=>{let from=$('from').value,to=$('to').value,style=$('edgeStyle').value;if(!from||!to||from===to){toast('请选择两个不同的节点');return}if(state.edges.some(e=>e.from===from&&e.to===to)){toast('这两个节点之间已存在同向连线');return}mutate(()=>state.edges.push({id:uid(),from,to,style}))};
function download(name,data,type){let u=URL.createObjectURL(new Blob([data],{type}));let a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),15000);toast('已发起下载：'+name)}
$('json').onclick=()=>download('海威图示数据.json',JSON.stringify(state,null,2),'application/json');
$('htmlout').onclick=()=>{let doc=document.documentElement.cloneNode(true);doc.querySelector('#seed').textContent=JSON.stringify(state).replace(/</g,'\\u003c');doc.querySelector('#board').replaceChildren();doc.querySelector('#panel').replaceChildren();doc.querySelector('#toast').style.display='none';doc.querySelector('body').classList.remove('present');download('海威作业一_编辑版.html','<!doctype html>\n'+doc.outerHTML,'text/html;charset=utf-8')};
$('svgout').onclick=()=>{let prev=sel;sel=null;render();let s=$('board').cloneNode(true),d=dims();s.removeAttribute('style');s.setAttribute('width',d.w);s.setAttribute('height',d.h);s.setAttribute('font-family','PingFang SC, Microsoft YaHei, sans-serif');let bg=el('rect',{width:'100%',height:'100%',fill:'white'});s.insertBefore(bg,s.firstChild);s.querySelectorAll('[tabindex]').forEach(n=>n.removeAttribute('tabindex'));download('海威组织与收益.svg',new XMLSerializer().serializeToString(s),'image/svg+xml');sel=prev;render()};
function validate(s){if(!s||s.version!==1||typeof s.title!=='string'||typeof s.subtitle!=='string'||!Array.isArray(s.nodes)||!Array.isArray(s.edges)||s.nodes.length>150||s.edges.length>400)throw Error('文件格式不正确或内容过大');let ids=new Set();for(const n of s.nodes){if(typeof n.id!=='string'||ids.has(n.id)||typeof n.title!=='string'||typeof n.body!=='string'||n.title.length>500||n.body.length>5000||!Number.isFinite(n.x)||!Number.isFinite(n.y)||n.x<0||n.x>15000||n.y<100||n.y>20000||!Number.isFinite(n.w)||n.w<240||n.w>700||!colors[n.color])throw Error('节点数据不合法');ids.add(n.id)}let ei=new Set();for(const e of s.edges){if(typeof e.id!=='string'||ei.has(e.id)||ids.has(e.id)||!ids.has(e.from)||!ids.has(e.to)||!['solid','dashed'].includes(e.style))throw Error('连线数据不合法');ei.add(e.id)}return s}
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{if(f.size>2000000)throw Error('文件大于 2 MB');let imported=validate(JSON.parse(await f.text()));mutate(()=>{state=imported;sel=null});fit();toast('已导入，可撤销恢复')}catch(err){toast('导入失败：'+err.message)}e.target.value=''};
$('reset').onclick=()=>{if(confirm('恢复打开此 HTML 时的初始图示？当前修改可以撤销恢复。')){mutate(()=>{state=structuredClone(initial);sel=null});fit()}};
render();panel();fit();$('status').textContent='已载入 · 修改后请点击「应用修改」 · 可保存完整 HTML';
if(cached&&cached!==JSON.stringify(initial)){try{const draft=validate(JSON.parse(cached));if(confirm('发现此文件的浏览器草稿，是否恢复？取消将使用 HTML 内保存的版本。')){state=draft;render();panel();fit();$('status').textContent='已恢复浏览器草稿'}}catch(e){toast('旧草稿无效，已使用文件内版本')}}
</script></body></html>
