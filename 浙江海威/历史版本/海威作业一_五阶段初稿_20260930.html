function download(name,data,type){const url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),20000);tell('已发起下载：'+name)}
$('json').onclick=()=>download('海威_五阶段方案.json',JSON.stringify(state,null,2),'application/json');
$('html').onclick=()=>{const d=document.documentElement.cloneNode(true);d.querySelector('#seed').textContent=JSON.stringify(state).replace(/</g,'\\u003c');d.querySelector('#main').replaceChildren();d.querySelector('#nav').replaceChildren();d.querySelector('body').classList.remove('preview');d.querySelector('#restore').hidden=true;d.querySelector('#toast').style.display='none';download('海威作业一_五阶段编辑版.html','<!doctype html>\n'+d.outerHTML,'text/html;charset=utf-8')};
function validate(s){const str=(x,max=12000)=>typeof x==='string'&&x.length<=max;if(!s||s.version!==2||!Array.isArray(s.stages)||s.stages.length!==5||!Number.isInteger(s.active)||s.active<0||s.active>4)throw Error('请导入五阶段编辑器导出的 JSON；旧图示数据格式不同。');for(const st of s.stages){for(const k of ['id','period','name','basis','root','orgNote'])if(!str(st[k]))throw Error('阶段字段不完整');for(const k of ['units','people','goals'])if(!Array.isArray(st[k])||st[k].length>60)throw Error('条目数量不合法');for(const u of st.units)if(!str(u.title)||!str(u.body)||typeof u.dashed!=='boolean')throw Error('组织数据不合法');for(const p of st.people)for(const k of ['role','source','count','ability'])if(!str(p[k]))throw Error('人员数据不合法');for(const g of st.goals)for(const k of ['title','value','measure'])if(!str(g[k]))throw Error('预期数据不合法')}return s}
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>3000000)throw Error('文件超过 3 MB');const data=validate(JSON.parse(await f.text()));change(()=>state=data);tell('已导入全部五个阶段，可撤销恢复。')}catch(err){tell('导入失败：'+err.message)}e.target.value=''};
try{const raw=localStorage.getItem(key);if(raw&&raw!==JSON.stringify(initial)){draft=validate(JSON.parse(raw));$('restore').hidden=false}}catch(e){}
$('restoreYes').onclick=()=>{change(()=>state=clone(draft));$('restore').hidden=true;tell('已恢复浏览器草稿')};$('restoreNo').onclick=()=>{$('restore').hidden=true;saved()};
window.addEventListener('resize',()=>document.querySelectorAll('textarea').forEach(grow));render();$('status').textContent='直接修改文字即可自动保存草稿｜保存完整 HTML 或导出数据，保留全部五个阶段的修改。';
