组织与运作基础，开始形成收益", "basis": "依据已有讨论整理；岗位归属、人数及收益目标尚待 CEO 对齐。", "root": "集团供应链与数字化 VP（拟议）", "orgNote": "0—3 个月完成架构和运作模式梳理；3—6 个月让改进机制持续运行。制造执行由运营团队组织，明确计划、资源协调与异常升级接口。", "units": [{"title": "新建计划职能", "body": "承接需求整合、产能评估、交付预测和计划执行反馈。", "dashed": false}, {"title": "承接供应链／仓储物流", "body": "明确库存、仓储、厂内配送及交付接口，连接信息指令与物理动作。", "dashed": false}, {"title": "调整信息化归属", "body": "由运营 VP 下的系统模块维护，转向业务与数字化协同；保留 ERP、OA 等运维责任。", "dashed": false}, {"title": "IE 联合现场参与", "body": "在现有环境与条件下观察、测量一线，与计划、实物流人员共同验证最佳实践。是否调整组织归属待讨论。", "dashed": true}], "people": [{"role": "计划与运营分析", "source": "评估适合的现有信息化人员“转型”；能力缺口另行补充", "count": "待定", "ability": "掌握业务底层逻辑、前后衔接点、价值目标与软件功能边界。"}, {"role": "数字化业务人员", "source": "现有信息化团队评估、转型", "count": "待定", "ability": "进入现场，理解软件怎样服务人员和提升过程价值；识别物理事实的数字转化点。"}, {"role": "仓储／物流执行与规划", "source": "承接现有相关人员，明确负责人", "count": "待定", "ability": "负责人须充分理解“物流规划”；业务可深入现场；能理解、评价、预判并按权限调整。"}, {"role": "专业开发与系统保障", "source": "内部配置或结合现有系统供应商", "count": "1人", "ability": "专业开发为设想，待核工作量。负责接口、测试、部署与维护，支持业务工具落地。"}, {"role": "IE 协作人员", "source": "现有资源联合参与；归属未定", "count": "1人", "ability": "观察动作、时间、布局和人机协同，以现场事实支持方案。"}], "goals": [{"title": "0-3个月建立原运作基线", "value": "明确原产出、成本、库存及业务条件，为后续比较提供依据。", "measure": "保存统计口径、业务条件、运行记录及实施投入。"}, {"title": "3—6 个月完成新结构形态", "value": "以宁德为先导强化生产内核，减少时间、质量和作业损失；具体方案留待作业二。", "measure": "产出及损失变化持续留证；收益预期不等同于正式确认。"}, {"title": "人员、工具与现场共同运转", "value": "指令可执行、反馈可信、异常有责任人；人员在真实任务中成长。", "measure": "计划执行、工具使用、数据质量和异常处理记录。"}]}, {"id": "s2", "period": "6～12 个月（1年）", "name": "正式核算收益，固化协同机制", "basis": "收益核算及延展方向依据已有讨论；本阶段具体人员安排为建议稿。", "root": "集团供应链与数字化 VP（拟议）", "orgNote": "根据前期试运行校准职责、权限和协作接口；在真实改善结果基础上扩大覆盖，不以系统上线代替经营成绩。", "units": [{"title": "计划与供应链协同", "body": "计划、仓储、物流以统一业务事实协同，明确客户与供应端接口。", "dashed": false}, {"title": "数字化运行与系统衔接", "body": "连接必要的 U9、现场采集和业务工具，明确数据、接口和运维责任。", "dashed": false}, {"title": "业务与财务共同验证", "body": "业务负责改善与证据，财务协同确认收益口径及实际影响。", "dashed": false}, {"title": "IE 持续验证最佳实践", "body": "参与动作、物流布局、线平衡和人机协同验证；汇报关系待讨论。", "dashed": true}], "people": let [people,pb]=section('人员构成','人数可填写具体数字、范围或“待定”；各阶段互不覆盖。',()=>change(()=>s.people.push({role:'新增角色',source:'待明确',count:'待定',ability:'填写能力与培养要求。'})));const wrap=elem('div','table-wrap'),table=elem('table','people'),thead=elem('thead'),tr=elem('tr');['角色／岗位','来源／配置方式','人数／编制设想','能力要求与培养重点',''].forEach(t=>tr.append(elem('th','',t)));thead.append(tr);table.append(thead);const tbody=elem('tbody');s.people.forEach((p,i)=>{const row=elem('tr');for(const[k,label]of [['role','角色'],['source','人员来源'],['count','人数'],['ability','能力要求']]){const td=elem('td');td.append(edit(p,k,label));row.append(td)}const td=elem('td','edit-only');td.append(button('删除',()=>remove(s.people,i,p.role),'linkbutton danger'));row.append(td);tbody.append(row)});table.append(tbody);wrap.append(table);pb.append(wrap);if(!s.people.length)pb.append(elem('p','empty','暂无人员，点击「添加」建立。'));m.append(people);
let [goals,gb]=section('预期／目的','分别填写希望获得的价值，以及判断是否实现的依据。',()=>change(()=>s.goals.push({title:'新增预期',value:'填写预期价值。',measure:'填写验证依据。'})));const gl=elem('div','goals');s.goals.forEach((g,i)=>{const c=elem('article','goal');c.append(edit(g,'title','目的标题',true,'item-title'),elem('label','','希望实现的价值'),edit(g,'value','预期价值'),elem('label','','验证依据／兑现条件'),edit(g,'measure','验证依据'),button('删除此项',()=>remove(s.goals,i,g.title),'linkbutton danger edit-only'));gl.append(c)});gb.append(gl);if(!s.goals.length)gb.append(elem('p','empty','暂无预期，点击「添加」建立。'));m.append(goals);
const foot=elem('div','foot');foot.append(elem('span','','3—6 个月为预期收益形成期；第六个月后正式测算。IE 归属、编制和远期安排仍待对齐。'),button('恢复本阶段初稿',()=>{if(confirm('将本阶段恢复为此 HTML 内保存的初稿？其他阶段不变，可撤销。'))change(()=>state.stages[state.active]=clone(initial.stages[state.active]))},'small edit-only'));m.append(foot);document.body.classList.toggle('preview',preview);$('preview').textContent=preview?'返回编辑':'预览';requestAnimationFrame(()=>m.querySelectorAll('textarea').forEach(grow));updateUndo()}
$('undo').onclick=()=>{if(!past.length)return;future.push(JSON.stringify(state));state=JSON.parse(past.pop());saved();render()};$('redo').onclick=()=>{if(!future.length)return;past.push(JSON.stringify(state));state=JSON.parse(future.pop());saved();render()};$('preview').onclick=()=>{preview=!preview;render()};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();(e.shiftKey?$('redo'):$('undo')).click()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();$('html').click()}if(!['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)){if(e.key==='ArrowRight'&&state.active<4)selectStage(state.active+1);if(e.key==='ArrowLeft'&&state.active>0)selectStage(state.active-1)}});
function download(name,data,type){const url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),20000);tell('已发起下载：'+name)}
$('json').onclick=()=>download('海威_五阶段方案.json',JSON.stringify(state,null,2),'application/json');
$('html').onclick=()=>{const d=document.documentElement.cloneNode(true);d.querySelector('#seed').textContent=JSON.stringify(state).replace(/</g,'\\u003c');d.querySelector('#main').replaceChildren();d.querySelector('#nav').replaceChildren();d.querySelector('body').classList.remove('preview');d.querySelector('#restore').hidden=true;d.querySelector('#toast').style.display='none';download('海威作业一_五阶段编辑版.html','<!doctype html>\n'+d.outerHTML,'text/html;charset=utf-8')};
function validate(s){const str=(x,max=12000)=>typeof x==='string'&&x.length<=max;if(!s||s.version!==2||!Array.isArray(s.stages)||s.stages.length!==5||!Number.isInteger(s.active)||s.active<0||s.active>4)throw Error('请导入五阶段编辑器导出的 JSON；旧图示数据格式不同。');for(const st of s.stages){if(st.reporting)for(const k of ['people','direct','functional','scope'])if(typeof st.reporting[k]!=='string'||st.reporting[k].length>12000)throw Error('汇报关系数据不合法');for(const k of ['id','period','name','basis','root','orgNote'])if(!str(st[k]))throw Error('阶段字段不完整');for(const k of ['units','people','goals'])if(!Array.isArray(st[k])||st[k].length>60)throw Error('条目数量不合法');for(const u of st.units)if(!str(u.title)||!str(u.body)||typeof u.dashed!=='boolean')throw Error('组织数据不合法');for(const p of st.people)for(const k of ['role','source','count','ability'])if(!str(p[k]))throw Error('人员数据不合法');for(const g of st.goals)for(const k of ['title','value','measure'])if(!str(g[k]))throw Error('预期数据不合法')}return s}
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>3000000)throw Error('文件超过 3 MB');const data=validate(JSON.parse(await f.text()));change(()=>state=data);tell('已导入全部五个阶段，可撤销恢复。')}catch(err){tell('导入失败：'+err.message)}e.target.value=''};
try{const raw=localStorage.getItem(key);if(raw&&raw!==JSON.stringify(initial)){draft=validate(JSON.parse(raw));$('restore').hidden=false}}catch(e){}
$('restoreYes').onclick=()=>{change(()=>state=clone(draft));$('restore').hidden=true;tell('已恢复浏览器草稿')};$('restoreNo').onclick=()=>{$('restore').hidden=true;saved()};
window.addEventListener('resize',()=>document.querySelectorAll('textarea').forEach(grow));render();$('status').textContent='直接修改文字即可自动保存草稿｜保存完整 HTML 或导出数据，保留全部五个阶段的修改。';
